async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25
stages:
- stage_id: 0
  attention_config:
    backend: FLASH_ATTN
    flash_attn_version: 2
  gpu_memory_utilization: 0.9
  num_gpu_blocks_override: 4096
  devices: 0,1
  num_replicas: 2
  enable_prefix_caching: true
  scheduling_policy: priority
  kv_transfer_config:
    kv_connector: OffloadingConnector
    kv_role: kv_both
    kv_connector_extra_config:
      spec_name: OmniCPUOffloadingSpec
      spec_module_path: vllm_omni.core.sidecar_offload
      omni_sidecar_cpu_bytes_limit: 2147483648
      cpu_bytes_to_use: 17179869184
      eviction_policy: lru
      store_threshold: 0
  default_sampling_params:
    temperature: 0.4
    top_p: 0.9
    top_k: 1
    max_tokens: 2048
    seed: 42
    repetition_penalty: 1.05
- stage_id: 1
  enable_prefix_caching: false
  attention_config:
    backend: FLASH_ATTN
    flash_attn_version: 2
  gpu_memory_utilization: 0.6
  devices: 2,3
  num_replicas: 2
  input_connectors:
    from_stage_0: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.9
    top_k: 50
    max_tokens: 4096
    seed: 42
    repetition_penalty: 1.05
- stage_id: 2
  enable_prefix_caching: false
  gpu_memory_utilization: 0.1
  max_num_seqs: 1
  enforce_eager: true
  async_scheduling: false
  max_num_batched_tokens: 51200
  devices: 2,3
  num_replicas: 2
  input_connectors:
    from_stage_1: connector_of_shared_memory
  default_sampling_params:
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    max_tokens: 65536
    seed: 42
    repetition_penalty: 1.1
