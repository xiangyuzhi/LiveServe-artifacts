# Qwen3-Omni-MoE 8-GPU deploy for standard-capacity pressure validation.
#
# Topology:
#   GPU 0-3: thinker (stage 0) x 4, each capped at 10744 KV blocks
#   GPU 4-7: talker (stage 1) x 4 + code2wav (stage 2) x 4
#
# The stage-0 aggregate capacity is 4 * 10744 * 16 = 687616 tokens,
# matching the standard offline simulator capacity of 687568 tokens within
# one block per thinker.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    gpu_memory_utilization: 0.9
    num_gpu_blocks_override: 10744
    devices: "0,1,2,3"
    num_replicas: 4
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    gpu_memory_utilization: 0.6
    devices: "4,5,6,7"
    num_replicas: 4
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    gpu_memory_utilization: 0.1
    max_num_seqs: 1
    enforce_eager: true
    async_scheduling: false
    max_num_batched_tokens: 51200
    devices: "4,5,6,7"
    num_replicas: 4
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
