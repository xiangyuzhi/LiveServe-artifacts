# Experimental Ming-flash-omni-2.0 async-chunk TP4 deploy.
#
# Topology matches ming_flash_omni_4gpu.yaml:
#   logical GPU 0-3: thinker TP=4 (stage 0)
#   logical GPU 3:   talker colocated with the last thinker shard (stage 1)
# Physical GPUs are selected by CUDA_VISIBLE_DEVICES.
#
# This enables pipeline-level async_chunk so stage 0 can emit text chunks to
# stage 1 through SharedMemoryConnector. It is intended for functional and
# latency experiments; keep the non-async config as the stable baseline.
pipeline: ming_flash_omni
async_chunk: true

trust_remote_code: true
distributed_executor_backend: mp
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.78
    enforce_eager: false
    tensor_parallel_size: 4
    max_num_batched_tokens: 32768
    devices: "0,1,2,3"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    compilation_config:
      pass_config:
        fuse_allreduce_rms: false
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      max_tokens: 2048
      repetition_penalty: 1.05
      detokenize: true
      ignore_eos: false

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.18
    enforce_eager: true
    max_num_batched_tokens: 1000000
    devices: "3"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1

platforms: {}
