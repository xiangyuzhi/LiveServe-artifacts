# Qwen3-Omni-MoE deploy for StreamingBench video-to-text on 2 GPUs.
#
# StreamingBench evaluates video understanding with text answers. Loading only
# the thinker/text stage avoids the talker/code2wav memory pressure from the
# full audio pipeline while still exercising video input and text generation.
async_chunk: true

modes:
  - mode: text-to-image
    stages: [0]

stages:
  - stage_id: 0
    gpu_memory_utilization: 0.60
    devices: "0,1"
    num_replicas: 2
    enable_prefix_caching: false
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05
