# Qwen3-Omni-MoE 2-GPU deploy for tiny-KV eviction diagnostics.
#
# Delta from qwen3_omni_moe_multi_replicas_2gpu_tinykv.yaml:
#   * stage 0 enables prefix caching so the KV block pool exposes cached free
#     blocks for replacement-policy selection.
#
# This is a quick policy-screening deploy, not a validation deploy. Confirm
# candidates on nano-KV, micro-KV, low-KV, and standard validation deploys.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    gpu_memory_utilization: 0.55
    num_gpu_blocks_override: 750
    devices: "0"
    enable_prefix_caching: true
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    gpu_memory_utilization: 0.6
    devices: "1"
    num_replicas: 1
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    gpu_memory_utilization: 0.1
    max_num_seqs: 1
    enforce_eager: true
    async_scheduling: false
    max_num_batched_tokens: 51200
    devices: "1"
    num_replicas: 1
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.1
